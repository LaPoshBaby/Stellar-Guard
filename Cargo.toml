[workspace]
members = ["contracts/freeze-governance"]
resolver = "2"

[workspace.dependencies]
arbitrary = { version = "=1.3.2", features = ["derive"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
