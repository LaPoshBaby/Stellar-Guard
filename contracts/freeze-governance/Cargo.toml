[package]
name = "stellar-guard-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# Declare testutils so Rust's check-cfg lint accepts cfg(feature = "testutils")
# emitted by soroban macros (#[contract], #[contractimpl], #[contracttype]).
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "20.5.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["testutils"] }
arbitrary = { workspace = true }
